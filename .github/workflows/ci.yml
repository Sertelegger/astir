name: CI

# Everything, on every push and pull request.
#
# This file previously tiered the expensive runners — macOS at 10x Linux and
# Windows at 2x — onto main and a weekly cron, and skipped docs-only changes
# entirely. That was never about coverage: it was a minute budget. While this
# repo was private it drew on the account's 2000 included minutes, and a single
# macOS job per run accounted for 320 of the 521 it burned in August.
#
# The repository is public now, and GitHub does not charge for standard runners
# on public repositories, so the only justification those rules ever had is
# gone. Keeping a coverage reduction whose reason has evaporated is how a
# codebase ends up with rules nobody can explain.
#
# `paths-ignore` had to go for a second reason. Branch protection requires
# named checks, and a check that never runs never reports — so a docs-only pull
# request would have sat permanently pending, unmergeable. A skipped required
# check is indistinguishable from a hanging one.
#
# The weekly cron stays: it is the only thing that catches drift in the runner
# images themselves, which no push-triggered run can see.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, not nightly. A scheduled run on an unchanged tree re-tests code
    # that already passed; the only thing it can catch is drift in the runner
    # image itself, which is rare. Nightly cost nearly as much as running macOS
    # on every PR did, which would have undone the point of this file.
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  verify:
    name: verify (ubuntu-latest, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # package.json declares node >=20, so the floor is tested explicitly
        # rather than assumed.
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Run these as separate steps rather than `npm run verify` so a failure
      # names which gate broke.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # This includes the artifact tests, which build and then spawn the real
      # dist/ output. A green unit suite is not evidence the thing runs — that
      # is the specific failure this project exists downstream of.
      - run: npm test

  macos:
    # The primary development platform, and the only one where the notification
    # and window-focus paths are real rather than skipped. It genuinely needs
    # covering: it is the primary development platform and the only one where
    # the notification and window-focus paths are real rather than skipped.
    name: verify (macos-latest, node 24)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  windows-early-warning:
    # PLT-02: native Windows is deferred for v1, not rejected, and no decision
    # may foreclose it. Running here surfaces path- and platform-specific
    # regressions while they are cheap to fix, without gating the branch on a
    # platform we do not yet claim to support.
    #
    # Non-blocking by design, so it never gates a merge — but running it per
    # pull request surfaces a path- or platform-specific regression while it is
    # still cheap to fix, which is the whole point of an early warning.
    name: windows (early warning, non-blocking)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
