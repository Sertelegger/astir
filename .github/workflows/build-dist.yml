name: build-dist

# Claude Code installs plugins as-is — it does NOT run a build step — so the
# runnable `dist/` artifacts that `hooks/hooks.json` invokes must exist in the
# repo. This workflow tests + builds every package and commits the refreshed
# artifacts back, so a git-based `/plugin install` always gets working code.
#
# Loop safety: pushes made with GITHUB_TOKEN do not re-trigger workflows, and
# the commit is additionally marked [skip ci].

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/dist/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dist-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGES: "relay web adapters/claude adapters/codex vscode-ext tui aggregate cli"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          set -euo pipefail
          for p in $PACKAGES; do
            echo "::group::install $p"
            (cd "$p" && npm install --no-audit --no-fund)
            echo "::endgroup::"
          done

      - name: Test
        run: |
          set -euo pipefail
          for p in $PACKAGES; do
            echo "::group::test $p"
            (cd "$p" && npm test)
            echo "::endgroup::"
          done

      - name: Typecheck
        run: |
          set -euo pipefail
          for p in $PACKAGES; do
            echo "::group::typecheck $p"
            (cd "$p" && npm run typecheck --if-present)
            echo "::endgroup::"
          done

      - name: Build
        run: npm run build

      - name: Verify entrypoints are runnable
        run: |
          set -euo pipefail
          for f in \
            relay/dist/relay/main.js \
            adapters/claude/dist/hook-entry.js \
            adapters/claude/dist/tailer-main.js \
            adapters/codex/dist/hook-entry.js \
            adapters/codex/dist/tailer-main.js \
            adapters/codex/dist/install-main.js \
            vscode-ext/dist/extension.js \
            tui/dist/main.js \
            aggregate/dist/main.js \
            cli/dist/main.js \
            web/dist/index.html
          do
            test -f "$f" || { echo "missing artifact: $f"; exit 1; }
            case "$f" in *.js) node --check "$f" ;; esac
          done
          echo "all entrypoints present and parseable"

      - name: Commit refreshed dist artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # dist/ is gitignored for local dev; force-add so installs get prebuilt code.
          for p in $PACKAGES; do git add -f "$p/dist"; done
          if git diff --staged --quiet; then
            echo "dist unchanged — nothing to commit"
          else
            git commit -m "build: refresh prebuilt dist artifacts [skip ci]"
            git push
          fi
